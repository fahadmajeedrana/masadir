<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2b45">
<meta name="description" content="صفوۃ المصادر — عربی مصادر کے فلیش کارڈ اور ثلاثی مجرد و مزید فیہ کی گردانیں">
<title>صفوۃ المصادر</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm column of content, a floating dock for navigation, the gardaan panel docks to the screen edge. */
:root {
  --ink: #1d2b45;
  --paper: #f4f5f2;
  --slip: #ffffff;
  --rule: #e3e6ea;
  --muted: #6a7384;
  --saffron: #b9770e;
  --saffron-soft: #f7eddb;
  --teal: #1f6f6b;
  --teal-soft: #e0f0ee;
  --glass: rgba(255,255,255,.78);
  --glass-b: rgba(29,43,69,.09);
  --shadow: 0 1px 2px rgba(29,43,69,.04), 0 6px 20px rgba(29,43,69,.06);
  --f-ar: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --f-ur: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Noto Sans Arabic", serif;
  --f-ui: "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8ecf3; --paper: #10151d; --slip: #18202b; --rule: #273140; --muted: #9aa4b5;
    --saffron: #e3a43c; --saffron-soft: #33291a; --teal: #62c3bb; --teal-soft: #163432;
    --glass: rgba(24,32,43,.8); --glass-b: rgba(255,255,255,.08);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8ecf3; --paper: #10151d; --slip: #18202b; --rule: #273140; --muted: #9aa4b5;
  --saffron: #e3a43c; --saffron-soft: #33291a; --teal: #62c3bb; --teal-soft: #163432;
  --glass: rgba(24,32,43,.8); --glass-b: rgba(255,255,255,.08);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; overflow-x: clip; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.ar { font-family: var(--f-ar); }
.muted { color: var(--muted); }

/* header */
header.top { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left));
  background: var(--glass); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); border-bottom: 1px solid var(--glass-b); }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(145deg, #23365a, #142036); color: #f0c06a; display: grid; place-items: center; font-family: var(--f-ar); font-size: 21px; font-weight: 700; flex: none; }
.brand h1 { margin: 0; font-family: var(--f-ar); font-size: 21px; font-weight: 700; line-height: 1.2; }
.install { border: 0; background: var(--saffron); color: #fff; border-radius: 10px; padding: 7px 14px; cursor: pointer; font-weight: 600; }

main { padding: 20px max(20px, env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.view-title { margin: 0; font-size: 22px; font-weight: 600; }

/* dock */
nav.dock { position: fixed; z-index: 18; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  display: flex; align-items: flex-end; gap: 4px; padding: 8px 10px;
  background: var(--glass); backdrop-filter: saturate(1.8) blur(22px); -webkit-backdrop-filter: saturate(1.8) blur(22px);
  border: 1px solid var(--glass-b); border-radius: 24px; box-shadow: 0 10px 40px rgba(15,22,36,.16), 0 2px 6px rgba(15,22,36,.06); }
nav.dock button { position: relative; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 6px 5px; border-radius: 16px; color: var(--muted); transition: transform .18s cubic-bezier(.3,.7,.3,1.4); transform-origin: bottom center; }
nav.dock .ico { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: var(--slip); border: 1px solid var(--glass-b); }
nav.dock .ico svg { width: 21px; height: 21px; }
nav.dock .lbl { font-size: 11px; font-weight: 600; white-space: nowrap; }
nav.dock button[aria-selected="true"] .ico { background: var(--teal); border-color: transparent; color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--teal) 35%, transparent); }
nav.dock button[aria-selected="true"] .lbl { color: var(--teal); }
@media (hover: hover) {
  nav.dock button:hover { transform: scale(1.16) translateY(-5px); color: var(--ink); }
  nav.dock button:hover + button, nav.dock button:has(+ button:hover) { transform: scale(1.06) translateY(-2px); }
}
nav.dock .dsep { width: 1px; align-self: stretch; margin: 6px 4px 18px; background: var(--glass-b); }
nav.dock button:focus-visible { outline: none; } nav.dock button:focus-visible .ico { outline: 2px solid var(--saffron); outline-offset: 2px; }
@media (min-width: 1100px) {
  nav.dock { left: auto; right: max(18px, env(safe-area-inset-right)); top: 50%; bottom: auto; transform: translateY(-50%); flex-direction: column; align-items: center; padding: 10px 8px; }
  nav.dock button { transform-origin: right center; }
  nav.dock .dsep { width: auto; height: 1px; margin: 2px 8px; }
  @media (hover: hover) { nav.dock button:hover { transform: scale(1.14) translateX(-5px); } nav.dock button:hover + button, nav.dock button:has(+ button:hover) { transform: scale(1.05) translateX(-2px); } }
  main { padding-bottom: 48px; }
}
@media (max-width: 400px) { nav.dock .ico { width: 40px; height: 40px; } nav.dock .lbl { font-size: 10px; } }

/* masadir: search + filters */
.search { position: sticky; top: 64px; z-index: 6; display: flex; align-items: center; gap: 8px; background: var(--slip); border: 1px solid var(--rule); border-radius: 16px; padding: 4px 6px 4px 14px; box-shadow: var(--shadow); }
.search svg { flex: none; color: var(--muted); margin-inline-start: 8px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 4px; font-size: 16px; }
.search input:focus { outline: none; }
.filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--slip); border: 1px solid var(--rule); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 9px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
select.sel { border: 1px solid var(--rule); background: var(--slip); border-radius: 12px; padding: 7px 12px; cursor: pointer; font-size: 14px; max-width: 100%; }
.iconbtn { border: 1px solid var(--rule); background: var(--slip); border-radius: 12px; height: 36px; padding: 0 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.iconbtn[aria-pressed="true"] { background: var(--saffron-soft); border-color: var(--saffron); color: var(--saffron); }
.filters .count { margin-inline-start: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.card { position: relative; background: var(--slip); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px 16px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; transition: transform .15s ease, box-shadow .15s ease, border-color .15s; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--teal) 40%, var(--rule)); }
.card .masdar { font-family: var(--f-ar); font-size: 30px; font-weight: 700; line-height: 1.55; }
.card .meaning { font-family: var(--f-ur); font-size: 14px; line-height: 2.1; color: var(--ink); opacity: .85; transition: filter .15s; min-height: 2.1em; }
.card .foot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex: none; }
.dot.mz { background: var(--saffron); }
.card .known { margin-inline-start: auto; color: var(--teal); font-size: 12px; }
.grid.hide .meaning { filter: blur(7px); user-select: none; }
.grid.hide .card:hover .meaning, .grid.hide .card:focus-visible .meaning { filter: none; }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; display: grid; gap: 12px; justify-items: center; }

/* buttons */
.btn { border: 1px solid var(--rule); background: var(--slip); border-radius: 12px; padding: 9px 16px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.accent { background: var(--saffron); color: #fff; border-color: var(--saffron); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.good[aria-pressed="true"] { background: var(--teal); color: #fff; border-color: var(--teal); }

/* study */
.study { display: grid; gap: 16px; justify-items: center; }
.study .settings { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.flip { width: min(540px, 100%); aspect-ratio: 3 / 2; perspective: 1400px; cursor: pointer; border: 0; background: none; padding: 0; }
.flip-inner { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
.flip.on .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--slip); border: 1px solid var(--rule); border-radius: 26px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; text-align: center; }
.face.back { transform: rotateY(180deg); }
.face .big { font-family: var(--f-ar); font-size: clamp(46px, 12vw, 76px); font-weight: 700; line-height: 1.4; }
.face .um { font-family: var(--f-ur); font-size: clamp(20px, 5vw, 28px); line-height: 2.2; }
.face .sub { font-family: var(--f-ar); font-size: 20px; color: var(--muted); }
.face .tag { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.face .hint { position: absolute; bottom: 14px; font-size: 12px; color: var(--muted); opacity: .7; }
.progress { width: min(540px, 100%); display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress .bar { flex: 1; height: 4px; background: var(--rule); border-radius: 9px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--teal); border-radius: 9px; transition: width .2s; }
.ctrls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; width: min(540px, 100%); }
.ctrls .btn { flex: 1; min-width: 92px; }

/* maker */
.maker { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.maker .row > input { width: 100%; }
.maker .row > .btn { flex: none; }
.maker .row { display: flex; gap: 8px; }
.maker input { flex: 1; min-width: 0; font-family: var(--f-ar); font-size: 24px; border: 1px solid var(--rule); background: var(--slip); border-radius: 14px; padding: 4px 16px; box-shadow: var(--shadow); }
.examples { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.examples button { border: 0; background: var(--teal-soft); color: var(--teal); border-radius: 999px; padding: 2px 12px; cursor: pointer; font-family: var(--f-ar); font-size: 17px; }

/* gardaan panel */
.gp { display: flex; flex-direction: column; gap: 16px; }
.gp-head { display: flex; align-items: flex-start; gap: 12px; }
.gp-head .t { flex: 1; min-width: 0; }
.gp-head .ar { font-size: 42px; font-weight: 700; line-height: 1.35; display: block; }
.gp-head .mean { font-family: var(--f-ur); font-size: 16px; line-height: 2.1; color: var(--muted); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--rule); color: var(--muted); }
.pill.root { font-family: var(--f-ar); font-size: 15px; letter-spacing: 5px; color: var(--ink); }
.close { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--rule); background: var(--slip); cursor: pointer; font-size: 16px; color: var(--muted); }
.pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { display: flex; flex-direction: column; gap: 4px; }
.pick label { font-size: 12px; color: var(--muted); font-weight: 500; }
.pick select { border: 1px solid var(--rule); background: var(--slip); border-radius: 12px; padding: 8px 10px; width: 100%; cursor: pointer; }
.pick select.ar { font-size: 18px; padding: 4px 10px; }
.rootin { display: flex; gap: 6px; }
.rootin input { width: 50px; text-align: center; font-family: var(--f-ar); font-size: 24px; border: 1px solid var(--rule); background: var(--slip); border-radius: 12px; padding: 2px; }

.babcard { border-radius: 16px; background: color-mix(in srgb, var(--teal-soft) 60%, var(--slip)); border: 1px solid color-mix(in srgb, var(--teal) 18%, transparent); padding: 12px 14px; }
.babcard.mz { background: color-mix(in srgb, var(--saffron-soft) 70%, var(--slip)); border-color: color-mix(in srgb, var(--saffron) 20%, transparent); }
.babcard .row1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.babcard .wz { font-family: var(--f-ar); font-size: 22px; font-weight: 700; }
.babcard .use { font-size: 12px; color: var(--muted); }
.babcard .sign { font-size: 13.5px; line-height: 1.9; margin-top: 2px; }
.babcard details { margin-top: 4px; }
.babcard summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--teal); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
.babcard.mz summary { color: var(--saffron); }
.babcard summary::-webkit-details-marker { display: none; }
.babcard summary::before { content: "‹"; display: inline-block; transition: transform .15s; }
.babcard details[open] summary::before { transform: rotate(-90deg); }
.babcard ul { margin: 6px 0 4px; padding-inline-start: 18px; font-size: 13.5px; line-height: 1.95; }
.babcard .ex { font-size: 13px; color: var(--muted); }
.babcard .ex .ar { font-size: 18px; color: var(--ink); }

.sagheer { font-family: var(--f-ar); font-size: 21px; line-height: 2; padding: 10px 14px; border-radius: 14px; background: var(--slip); border: 1px dashed var(--rule); }
.sagheer .k { font-family: var(--f-ui); font-size: 11px; color: var(--muted); display: block; line-height: 1.4; }
.sagheer b { font-weight: 700; color: var(--teal); }

.tables { display: grid; gap: 16px; }
.tables.multi { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.tbl { background: var(--slip); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.tbl h3 { margin: 0; padding: 10px 14px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--rule); }
.tbl .copy { border: 0; background: var(--paper); color: var(--muted); border-radius: 8px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.tbl .grp { padding: 6px 14px 2px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; background: var(--paper); }
.tbl .r { display: flex; align-items: center; gap: 10px; padding: 3px 14px; border-top: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); }
.tbl .grp + .r { border-top: 0; }
.tbl .r:hover { background: var(--teal-soft); }
.tbl .fm { font-family: var(--f-ar); font-size: 24px; font-weight: 700; line-height: 1.75; flex: 1; }
.tbl .lb { font-size: 12px; color: var(--muted); text-align: left; white-space: nowrap; }
.tbl .lb .ar { font-size: 15px; margin-inline-start: 6px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.9; }
.warn { background: var(--saffron-soft); border-radius: 12px; padding: 8px 12px; font-size: 13px; line-height: 1.9; }

/* docked sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-end; background: rgba(10,15,25,.38); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.sheet .body { background: var(--paper); width: 100%; max-height: 94%; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 10px max(18px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); animation: up .24s ease; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.grabber { width: 42px; height: 5px; border-radius: 9px; background: var(--rule); margin: 0 auto 12px; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (min-width: 900px) {
  .sheet { align-items: stretch; justify-content: flex-start; }
  .sheet .body { width: min(720px, 60vw); max-height: none; height: 100%; border-radius: 0 26px 26px 0; padding-top: 22px; animation: slideIn .26s cubic-bezier(.2,.8,.2,1); box-shadow: 10px 0 50px rgba(0,0,0,.22); }
  .grabber { display: none; }
}
@keyframes slideIn { from { transform: translateX(-40px); opacity: .4; } to { transform: none; opacity: 1; } }
.toast { position: fixed; bottom: calc(110px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 10px; font-size: 13px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }

@media (max-width: 560px) {
  main { padding-top: 14px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card { padding: 12px 12px 10px; }
  .card .masdar { font-size: 26px; }
  .pickers { grid-template-columns: 1fr; }
  .gp-head .ar { font-size: 36px; }
  .tbl .fm { font-size: 22px; }
  .filters .count { width: 100%; margin: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="mark" aria-hidden="true">ص</div><h1>صفوۃ المصادر</h1></div>
  <button class="install" id="installBtn" hidden>انسٹال کریں</button>
</header>

<nav class="dock" role="tablist" aria-label="مینو">
  <button role="tab" data-view="masadir" aria-selected="true" id="tab-masadir"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><span class="lbl">مصادر</span></button>
  <button role="tab" data-view="study" aria-selected="false" id="tab-study"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="13" height="16" rx="2.5"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/></svg></span><span class="lbl">فلیش کارڈ</span></button>
  <button role="tab" data-view="maker" aria-selected="false" id="tab-maker"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></span><span class="lbl">گردان ساز</span></button>
  <span class="dsep" aria-hidden="true"></span>
  <button id="dockTheme" aria-label="تھیم بدلیں"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span><span class="lbl">تھیم</span></button>
</nav>

<main>
  <!-- MASADIR -->
  <section class="wrap" id="view-masadir">

// افتعال: R1 + ت assimilation

    s = s.replace(/ِوْ/g, 'ِي').replace(/ُيْ/g, 'ُو');        // mithal i'lal
    s = s.replace(/ُوْ/g, 'ُو').replace(/ِيْ/g, 'ِي');
    s = s.replace(/ّ([ًٌٍَُِ])/g, 'ّ$1');
    return s;
  }).join(' ');
}

// ---- core conjugator ----
function makeForm(prefixTok, stem, suf, naqisTable, ri, ctx) {
  if (ri.naqis && !ctx.noWeak) {
    const n = stem.length, r2 = stem[n - 2];
    const cls = vcls(r2.v);
    const tbl = naqisTable(cls);
    const head = [...prefixTok, ...stem.slice(0, n - 2)];
    return { tokens: [...head, { ...r2, v: '' }], str: tokStr(head) + r2.c + (r2.sh ? SH : '') + tbl[ctx.i] };
  }
  let s = suf;
  const vowelSuf = s[0] !== S;
  let st = stem;
  if (ctx.ajwaf) st = vowelSuf ? ctx.ajwaf.open : ctx.ajwaf.closed;
  if (ctx.dbl && canContract(st)) {
    if (vowelSuf) st = contract(st);
    else if (s === S) { st = contract(st); s = F; }
  }
  const all = [...prefixTok, ...st];
  return { tokens: all, str: tokStr(all) + s };
}

function ctxFor(bab, ri, stem, kind) {
  const ctx = { noWeak: !!stems(bab, ri.R).noWeak, dbl: ri.mudaaf || bab === 'fl' };
  if (ri.ajwaf && !ctx.noWeak && AJWAF_BABS.includes(bab)) ctx.ajwaf = ajwaf(stem, bab, kind === 'madiA' && BABS[bab].group === 'mujarrad');
  return ctx;
}

function prepMudStem(bab, ri, active) {
  const S0 = stems(bab, ri.R);
  let stem = clone(active ? S0.mudA : S0.mudP);
  if (active && ri.R[0] === 'و' && MITHAL_DROP.includes(bab)) stem = stem.slice(1);
  return stem;
}

function madi(bab, ri, active) {
  const S0 = stems(bab, ri.R), stem = active ? S0.madiA : S0.madiP;
  const ctx = ctxFor(bab, ri, stem, active ? 'madiA' : 'madiP');
  const mujW = BABS[bab].group === 'mujarrad' && ri.R[2] === 'و';
  return SIGHA.map((_, i) => ortho(makeForm([], stem, MADI[i], (c) => naqisMadi(c, mujW ? 'و' : 'ي', mujW ? 'ا' : 'ى'), ri, { ...ctx, i }).str));
}

function mudari(bab, ri, active, jazm) {
  const S0 = stems(bab, ri.R), stem = prepMudStem(bab, ri, active);
  const ctx = ctxFor(bab, ri, stem, 'mud');
  const pv = active ? S0.pvA : S0.pvP;
  return SIGHA.map((_, i) => ortho(makeForm([t(PFX[i], pv)], stem, (jazm ? JAZM : MUD)[i], (c) => (jazm ? NAQIS_JAZM : NAQIS_MUD)[c], ri, { ...ctx, i }).str));
}

const AMR_EXC = ['ءكل', 'ءخذ', 'ءمر'];
function amrHazir(bab, ri, i) {
  let stem = prepMudStem(bab, ri, true);
  if (BABS[bab].group === 'mujarrad' && AMR_EXC.includes(ri.R.join(''))) stem = stem.slice(1);
  const ctx = ctxFor(bab, ri, stem, 'mud');
  const f = makeForm([], stem, JAZM[i], (c) => NAQIS_JAZM[c], ri, { ...ctx, i });
  let out = f.str;
  if (bab === 'if') out = HAMZA + F + out;
  else {
    const first = f.tokens[0];
    if (first && first.v === S) {
      const second = f.tokens.slice(1).find((x) => !x.long && x.v && x.v !== S);
      out = 'ا' + (second && second.v === D ? D : K) + out;
    }
  }
  return ortho(out);
}

function amr(bab, ri, active) {
  const j = mudari(bab, ri, active, true);
  return SIGHA.map((_, i) => {
    if (active && i >= 6 && i <= 11) return amrHazir(bab, ri, i);
    return 'لِ' + j[i];
  });
}
function nahi(bab, ri, active) {
  return mudari(bab, ri, active, true).map((x) => 'لَا ' + x);
}

// ---- ism fa'il / maf'ool ----
function ismStem(bab, ri, faail) {
  const [a, b, c] = ri.R;
  if (BABS[bab].group === 'mujarrad') {
    if (faail) {
      if (ri.ajwaf) return [t(a, F, 1), L('ا'), t(HAMZA, K, 2), t(c, '', 3)];
      return [t(a, F, 1), L('ا'), t(b, K, 2), t(c, '', 3)];
    }
    if (ri.ajwaf) return [t('م', F), t(a, b === 'و' ? D : K, 1), L(b), t(c, '', 3)];
    return [t('م', F), t(a, S, 1), t(b, D, 2), L('و'), t(c, '', 3)];
  }
  const st = clone(stems(bab, ri.R).mudA);
  st[st.length - 2].v = faail ? K : F;
  return [t('م', D), ...st];
}
function ism(bab, ri, faail) {
  const stem = ismStem(bab, ri, faail);
  const muj = BABS[bab].group === 'mujarrad';
  const noWeak = !!stems(bab, ri.R).noWeak;
  if (ri.naqis && !noWeak) {
    const n = stem.length;
    if (!faail && muj) {
      const k2 = stem.findIndex((x) => x.r === 2);
      const head = tokStr(stem.slice(0, k2)) + stem[k2].c;
      const core = ri.R[2] === 'و' ? D + 'وّ' : K + 'يّ';
      return ISM.map((s) => ortho(head + core + s));
    }
    const head = tokStr(stem.slice(0, n - 2)) + stem[n - 2].c + (stem[n - 2].sh ? SH : '');
    const tbl = faail ? ['ٍ', K+'يَانِ', D+'ونَ', K+'يَةٌ', K+'يَتَانِ', K+'يَاتٌ'] : ['ًى', F+'يَانِ', F+'وْنَ', F+'اةٌ', F+'اتَانِ', F+'يَاتٌ'];
    return tbl.map((s) => ortho(head + s));
  }
  if (faail && muj && ri.ajwaf && ri.R[2] === HAMZA) {
    const head = ri.R[0] + F + 'ا' + HAMZA;
    return ['ٍ', K+'يَانِ', D+'ونَ', K+'يَةٌ', K+'يَتَانِ', K+'يَاتٌ'].map((x) => ortho(head + x));
  }
  let st = stem;
  if (ri.ajwaf && !muj && !noWeak && AJWAF_BABS.includes(bab)) st = ajwaf(stem, bab, false).open;
  if ((ri.mudaaf || bab === 'fl') && canContract(st)) st = contract(st);
  return ISM.map((s) => ortho(tokStr(st) + s));
}

// ---- masdar (qiyasi for mazeed) ----
function masdarOf(bab, ri) {
  const [a, b, c] = ri.R;
  if (BABS[bab].group === 'mujarrad') return null;
  const nq = ri.naqis, aj = ri.ajwaf;
  let w;
  switch (bab) {
    case 'if': w = aj ? 'إِ' + a + F + 'ا' + c + F + 'ةٌ' : HAMZA + K + a + S + b + F + 'ا' + (nq ? HAMZA : c) + 'ٌ'; break;
    case 'tf': w = nq ? 'تَ' + a + S + b + K + 'يَةٌ' : 'تَ' + a + S + b + K + 'ي' + c + 'ٌ'; break;
    case 'mf': w = 'مُ' + a + F + 'ا' + b + F + (nq ? 'اةٌ' : c + F + 'ةٌ'); break;
    case 'ft': { const [x, y] = taPair(a); w = 'اِ' + x + S + y + K + (aj ? 'ي' : b) + F + 'ا' + (nq ? HAMZA : c) + 'ٌ'; break; }
    case 'nf': w = 'اِنْ' + a + K + (aj ? 'ي' : b) + F + 'ا' + (nq ? HAMZA : c) + 'ٌ'; break;
    case 'tfl': w = 'تَ' + a + F + b + SH + (nq ? K + 'ي' : D + c + 'ٌ'); break;
    case 'tfa': w = 'تَ' + a + F + 'ا' + b + (nq ? K + 'ي' : D + c + 'ٌ'); break;
    case 'st': w = aj ? 'اِسْتِ' + a + F + 'ا' + c + F + 'ةٌ' : 'اِسْتِ' + a + S + b + F + 'ا' + (nq ? HAMZA : c) + 'ٌ'; break;
    case 'fl': w = 'اِ' + a + S + b + K + c + F + 'ا' + c + 'ٌ'; break;
    case 'fy': w = 'اِ' + a + S + b + K + 'ي' + b + F + 'ا' + c + 'ٌ'; break;
  }
  return ortho(w);
}

const GARDAAN_TYPES = [
  { k: 'madiA', ur: 'ماضی معروف' }, { k: 'madiP', ur: 'ماضی مجہول' },
  { k: 'mudA', ur: 'مضارع معروف' }, { k: 'mudP', ur: 'مضارع مجہول' },
  { k: 'amrA', ur: 'امر معروف' }, { k: 'amrP', ur: 'امر مجہول' },
  { k: 'nahiA', ur: 'نہی معروف' }, { k: 'nahiP', ur: 'نہی مجہول' },
  { k: 'faail', ur: 'اسم فاعل' }, { k: 'mafool', ur: 'اسم مفعول' },
];

function gardaan(type, bab, R) {
  const ri = rootInfo(R);
  switch (type) {
    case 'madiA': return madi(bab, ri, true);
    case 'madiP': return madi(bab, ri, false);
    case 'mudA': return mudari(bab, ri, true, false);
    case 'mudP': return mudari(bab, ri, false, false);
    case 'amrA': return amr(bab, ri, true);
    case 'amrP': return amr(bab, ri, false);
    case 'nahiA': return nahi(bab, ri, true);
    case 'nahiP': return nahi(bab, ri, false);
    case 'faail': return ism(bab, ri, true);
    case 'mafool': return ism(bab, ri, false);
  }
}

function sarfSagheer(bab, R) {
  const ri = rootInfo(R);
  return {
    madi: madi(bab, ri, true)[0], mudari: mudari(bab, ri, true, false)[0],
    madiP: madi(bab, ri, false)[0], mudariP: mudari(bab, ri, false, false)[0],
    faail: ism(bab, ri, true)[0], mafool: ism(bab, ri, false)[0],
    amr: amrHazir(bab, ri, 6), nahi: nahi(bab, ri, true)[6],
    masdar: masdarOf(bab, ri),
  };
}

function rootKind(R) {
  const ri = rootInfo(R), k = [];
  if (ri.mudaaf) k.push('مضاعف');
  if (ri.mithal) k.push('مثال');
  if (ri.ajwaf) k.push('اجوف');
  if (ri.naqis) k.push('ناقص');
  if (ri.mahmuz) k.push('مہموز');
  return k.length ? k.join('، ') : 'صحیح';
}

// ---- normalisation & masdar -> root/bab detection ----
const stripHarakat = (s) => s.replace(/[ً-ٰٟـ]/g, '');
function normalize(s) {
  return stripHarakat(s).trim().replace(/[ٱ]/g, 'ا').replace(/آ/g, 'ءا').replace(/[أإؤئ]/g, 'ء').replace(/ى/g, 'ي').replace(/\s+/g, '');
}
function normRoot(s) {
  return stripHarakat(s).replace(/[أإؤئآ]/g, 'ء').replace(/ى/g, 'ي').replace(/ا/g, 'و').replace(/[\s\-ـ]/g, '');
}

function detectMasdar(input) {
  const n = normalize(input);
  const startsHamza = n[0] === HAMZA;
  const rules = [
    [/^است(.)(.)اء$/, 'st', (m) => [m[1], m[2], 'ي']],
    [/^است(.)ا(.)ة$/, 'st', (m) => [m[1], 'و', m[2]]],
    [/^است(.)(.)ا(.)$/, 'st', (m) => [m[1], m[2], m[3]]],
    [/^ا(.)(.)ي\2ا(.)$/, 'fy', (m) => [m[1], m[2], m[3]]],
  ];
  const ifRules = [
    [/^[ءا](.)ا(.)ة$/, 'if', (m) => [m[1], 'و', m[2]]],
    [/^[ءا](.)(.)اء$/, 'if', (m) => [m[1], m[2], 'ي']],
    [/^[ءا]ي(.)ا(.)$/, 'if', (m) => ['و', m[1], m[2]]],
    [/^[ءا](.)(.)ا(.)$/, 'if', (m) => [m[1], m[2], m[3]]],
  ];
  const ftRules = [
    [/^ا(.)ت(.)اء$/, 'ft', (m) => [m[1], m[2], 'ي']],
    [/^ا(.)ت(.)ا(.)$/, 'ft', (m) => [m[1], m[2], m[3]]],
    [/^ان(.)(.)اء$/, 'nf', (m) => [m[1], m[2], 'ي']],
    [/^ان(.)(.)ا(.)$/, 'nf', (m) => [m[1], m[2], m[3]]],
    [/^ا([صضطظ])ط(.)ا(.)$/, 'ft', (m) => [m[1], m[2], m[3]]],
    [/^ا([دذز])د(.)ا(.)$/, 'ft', (m) => [m[1], m[2], m[3]]],
    [/^ات(.)ا(.)$/, 'ft', (m) => ['و', m[1], m[2]]],
    [/^ا(.)(.)(.)ا\3$/, 'fl', (m) => [m[1], m[2], m[3]]],
  ];
  const rest = [
    [/^ت(.)(.)ية$/, 'tf', (m) => [m[1], m[2], 'ي']],
    [/^ت(.)(.)ي(.)$/, 'tf', (m) => [m[1], m[2], m[3]]],
    [/^ت(.)ا(.)(.)$/, 'tfa', (m) => [m[1], m[2], m[3]]],
    [/^ت(.)(.)(.)$/, 'tfl', (m) => [m[1], m[2], m[3]]],
    [/^م(.)ا(.)اة$/, 'mf', (m) => [m[1], m[2], 'و']],
    [/^م(.)ا(.)(.)ة$/, 'mf', (m) => [m[1], m[2], m[3]]],
  ];
  const ordered = [...rules, ...(startsHamza ? [...ifRules, ...ftRules] : [...ftRules, ...ifRules]), ...rest];
  for (const [re, bab, fn] of ordered) {
    const m = n.match(re);
    if (m) return { root: fn(m), bab, guessed: false };
  }
  // mujarrad heuristic
  let s = n.replace(/ة$/, '');
  if (s.length > 3 && s.endsWith('ان')) s = s.slice(0, -2);
  if (s.length === 4 && s[0] === 'م') s = s.slice(1);
  if (s.length === 4 && s.endsWith('اء')) return { root: [s[0], s[1], 'و'], bab: null, guessed: true };
  const arr = [...s];
  for (const ch of ['ا', 'و', 'ي']) {
    for (let i = arr.length - 1; i > 0 && arr.length > 3; i--) if (arr[i] === ch) arr.splice(i, 1);
  }
  if (arr.length === 2) arr.push(arr[1]);
  return { root: arr.slice(0, 3), bab: null, guessed: true };
}

    khas: ['تفعیل کی مطاوعت (عَلَّمْتُهُ فَتَعَلَّمَ: میں نے سکھایا تو اس نے سیکھا)۔', 'تکلف: کوئی صفت زبردستی اپنانا (تَكَبَّرَ، تَصَبَّرَ)۔', 'تدریج: کام تھوڑا تھوڑا کرنا (تَجَرَّعَ: گھونٹ گھونٹ پیا)۔', 'مضارع میں دو تاء جمع ہوں تو ایک گر سکتی ہے (تَتَنَزَّلُ ← تَنَزَّلُ)۔'],
    ex: 'تَعَلَّمَ، تَكَلَّمَ، تَفَكَّرَ، تَوَكَّلَ، تَلَقَّى' },

    sign: 'شروع میں تاء زائد اور فاء کلمہ کے بعد الف۔',

    ex: 'تَعَاوَنَ، تَقَاتَلَ، تَعَارَفَ، تَسَاءَلَ، تَمَارَضَ' },
  st: { wazn: ['اِسْتَفْعَلَ', 'يَسْتَفْعِلُ', 'اِسْتِفْعَالٌ'], use: 'اکثر متعدی',
    sign: 'ہمزہ وصلی کے بعد سین اور تاء زائد۔',

    ex: 'اِسْتَغْفَرَ، اِسْتَعْمَلَ، اِسْتَقْبَلَ، اِسْتَقَامَ، اِسْتَطَاعَ' },
  fl: { wazn: ['اِفْعَلَّ', 'يَفْعَلُّ', 'اِفْعِلَالٌ'], use: 'ہمیشہ لازم',
    sign: 'ہمزہ وصلی، اور لام کلمہ مکرر و مدغم۔',

    ex: 'اِحْمَرَّ، اِصْفَرَّ، اِخْضَرَّ، اِسْوَدَّ، اِبْيَضَّ' },
  fy: { wazn: ['اِفْعَوْعَلَ', 'يَفْعَوْعِلُ', 'اِفْعِيعَالٌ'], use: 'ہمیشہ لازم',
    sign: 'عین کلمہ مکرر، اور دونوں کے بیچ واؤ ساکن۔',
    khas: ['مجرد کے معنی میں بہت زیادہ مبالغہ (خَشُنَ: کھردرا ہوا ← اِخْشَوْشَنَ: بہت کھردرا ہوا)۔', 'نادر باب، چند الفاظ تک محدود۔'],

};

</script>
<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('sm:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sm:' + k, JSON.stringify(v)); } catch {} },
};
const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1600); };

// ---------- data ----------
const DATA = MASADIR_RAW.trim().split('\n').map((l, i) => {
  const [m, r, b, u] = l.split('|');
  return { id: i, m, root: [...r], b, u, nm: normalize(m), nr: r };
});
const byNorm = new Map(DATA.map((d) => [d.nm.replace(/[ٌٍ]/g, ''), d]));
const known = new Set(store.get('known', []));
const saveKnown = () => store.set('known', [...known]);
const isMz = (b) => BABS[b].group === 'mazeed';
const babOptions = (withAll) => (withAll ? '<option value="all">تمام ابواب</option>' : '') +
  '<optgroup label="ثلاثی مجرد">' + BAB_ORDER.filter((b) => !isMz(b)).map((b) => `<option value="${b}">${BABS[b].ar}</option>`).join('') + '</optgroup>' +
  '<optgroup label="ثلاثی مزید فیہ">' + BAB_ORDER.filter(isMz).map((b) => `<option value="${b}">${BABS[b].ur} · ${BABS[b].ar}</option>`).join('') + '</optgroup>';

// ---------- theme ----------
const rootEl = document.documentElement;
const th = store.get('theme', null); if (th) rootEl.dataset.theme = th;
$('#dockTheme').onclick = () => {
  const dark = rootEl.dataset.theme ? rootEl.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  rootEl.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', rootEl.dataset.theme);
};

// ---------- routing ----------
const VIEWS = ['masadir', 'study', 'maker'];
function show(v) {
  if (!VIEWS.includes(v)) v = 'masadir';
  VIEWS.forEach((x) => { $('#view-' + x).hidden = x !== v; $('#tab-' + x).setAttribute('aria-selected', x === v); });
  if (v === 'study') renderStudy();
  scrollTo(0, 0);
}
document.querySelectorAll('nav.dock [data-view]').forEach((b) => b.onclick = () => { location.hash = b.dataset.view; });
addEventListener('hashchange', () => { if (!$('#sheet').hidden) closeSheet(); show(location.hash.slice(1)); });

// ---------- masadir ----------
let fGroup = 'all', fBab = 'all', hideMeaning = store.get('hideM', false);
$('#babSel').innerHTML = babOptions(true);
function syncBabSel() {
  [...$('#babSel').querySelectorAll('optgroup')].forEach((g, i) => { g.hidden = fGroup !== 'all' && (i === 0 ? fGroup !== 'mujarrad' : fGroup !== 'mazeed'); });
  if (fBab !== 'all' && fGroup !== 'all' && BABS[fBab].group !== fGroup) fBab = 'all';
  $('#babSel').value = fBab;
}
$('#grpSeg').onclick = (e) => {
  const b = e.target.closest('[data-g]'); if (!b) return; fGroup = b.dataset.g;
  $('#grpSeg').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  syncBabSel(); renderGrid();
};
$('#babSel').onchange = (e) => { fBab = e.target.value; renderGrid(); };
function matches(d, q) {
  if (fGroup !== 'all' && BABS[d.b].group !== fGroup) return false;
  if (fBab !== 'all' && d.b !== fBab) return false;
  if (!q) return true;
  const qa = normalize(q), qr = normRoot(q);
  return d.nm.includes(qa) || (qr.length >= 2 && d.nr.replace(/ا/g, 'و').includes(qr)) || d.u.includes(q);
}
function renderGrid() {
  const q = $('#q').value.trim();
  const list = DATA.filter((d) => matches(d, q));
  $('#count').textContent = `${list.length} مصادر`;
  const g = $('#grid'); g.classList.toggle('hide', hideMeaning);
  if (!list.length) {
    g.innerHTML = `<div class="empty" style="grid-column:1/-1"><div>«${esc(q)}» فہرست میں نہیں ملا۔</div><button class="btn accent" id="toMaker">اس کی گردان بنائیں</button></div>`;
    const b = $('#toMaker'); if (b) b.onclick = () => { $('#mIn').value = q; location.hash = 'maker'; runMaker(); };
    return;
  }
  g.innerHTML = list.map((d) => `
    <div class="card" data-id="${d.id}" role="button" tabindex="0">
      <div class="masdar">${d.m}</div>
      <div class="meaning">${esc(d.u)}</div>
      <div class="foot"><span class="dot${isMz(d.b) ? ' mz' : ''}"></span>${BABS[d.b].ur}${known.has(d.id) ? '<span class="known">✓</span>' : ''}</div>
    </div>`).join('');
}
$('#grid').addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) openSheet(DATA[+c.dataset.id]); });
$('#grid').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('card')) openSheet(DATA[+e.target.dataset.id]); });
$('#q').addEventListener('input', renderGrid);
const hb = $('#hideM'); hb.setAttribute('aria-pressed', hideMeaning);
hb.onclick = () => { hideMeaning = !hideMeaning; hb.setAttribute('aria-pressed', hideMeaning); store.set('hideM', hideMeaning); renderGrid(); };

// ---------- gardaan panel ----------
const accus = (m) => m.replace(/ةٌ$/, 'ةً').replace(/اءٌ$/, 'اءً').replace(/ءٌ$/, 'ءً').replace(/ٌ$/, 'ًا');
function babCard(b, open) {
  const I = BAB_INFO[b], B = BABS[b];
  return `<div class="babcard${isMz(b) ? ' mz' : ''}">
    <div class="row1"><span class="wz">${I.wazn[0]} ${I.wazn[1]}${isMz(b) ? ' ' + I.wazn[2] : ''}</span><span class="use">${B.ur} · ${I.use}</span></div>
    <div class="sign">${I.sign}</div>
    <details${open ? ' open' : ''}><summary>خاصیات اور مثالیں</summary>
      <ul>${I.khas.map((k) => `<li>${k}</li>`).join('')}</ul>
      <div class="ex">مثالیں: <span class="ar">${I.ex}</span></div>
    </details></div>`;
}
function gardaanPanel(host, opts) {
  const st = { root: opts.root.slice(), bab: opts.bab || 'n', type: store.get('gtype', 'madiA') };
  const typeOpts = GARDAAN_TYPES.map((g) => `<option value="${g.k}">${g.ur}</option>`).join('') + '<option value="all">تمام گردانیں ایک ساتھ</option>';
  host.innerHTML = `<div class="gp">
    <div class="gp-head">
      <div class="t"><span class="ar" data-x="title"></span><div class="mean" data-x="mean"></div><div class="meta" data-x="meta"></div></div>
      ${opts.onClose ? '<button class="close" data-x="close" aria-label="بند کریں">✕</button>' : ''}
    </div>
    ${opts.guessed ? '<div class="warn">یہ مصدر فہرست میں نہیں۔ ثلاثی مجرد کا باب سماعی ہوتا ہے، اس لیے لغت دیکھ کر درست باب منتخب کریں۔</div>' : ''}
    ${opts.editableRoot ? `<div class="pick"><label>مادہ (درست کرنا ہو تو حرف بدلیں)</label><div class="rootin">${[0, 1, 2].map((i) => `<input data-r="${i}" maxlength="1" aria-label="حرف ${i + 1}" value="${esc(st.root[i] || '')}">`).join('')}</div></div>` : ''}
    <div class="pickers">
      <div class="pick"><label for="bab-${opts.id}">باب</label><select id="bab-${opts.id}" class="ar" data-x="bab">${babOptions(false)}</select></div>
      <div class="pick"><label for="typ-${opts.id}">گردان</label><select id="typ-${opts.id}" data-x="type">${typeOpts}</select></div>
    </div>
    <div data-x="babinfo"></div>
    <div class="sagheer" data-x="sagheer"></div>
    <div class="tables" data-x="tables"></div>
    <div class="note" data-x="note"></div>
  </div>`;
  const q = (x) => host.querySelector(`[data-x="${x}"]`);
  q('bab').value = st.bab; q('type').value = st.type;
  q('bab').onchange = (e) => { st.bab = e.target.value; draw(); };
  q('type').onchange = (e) => { st.type = e.target.value; store.set('gtype', st.type); draw(); };
  if (opts.onClose) q('close').onclick = opts.onClose;
  host.querySelectorAll('[data-r]').forEach((inp) => inp.addEventListener('input', () => {
    const v = inp.value.replace(/[ً-ٟ]/g, '').replace(/[أإؤئآ]/g, 'ء').replace(/ى/g, 'ي').replace(/ا/g, 'و');
    inp.value = v.slice(-1); st.root[+inp.dataset.r] = inp.value;
    if (inp.value && inp.dataset.r < 2) host.querySelector(`[data-r="${+inp.dataset.r + 1}"]`).focus();
    draw();
  }));
  host.addEventListener('click', (e) => {
    const c = e.target.closest('.copy'); if (!c) return;
    navigator.clipboard?.writeText(c.dataset.copy).then(() => toast('کاپی ہو گیا'), () => toast('کاپی نہیں ہو سکا'));
  });
  host.addEventListener('toggle', (e) => { if (e.target.tagName === 'DETAILS') store.set('babOpen', e.target.open); }, true);

  function table(type) {
    const g = GARDAAN_TYPES.find((x) => x.k === type);
    const forms = gardaan(type, st.bab, st.root);
    const isIsm = type === 'faail' || type === 'mafool';
    let rows = '';
    forms.forEach((f, i) => {
      if (isIsm) { if (i === 0) rows += '<div class="grp">مذکر</div>'; if (i === 3) rows += '<div class="grp">مؤنث</div>'; }
      else { if (i === 0) rows += '<div class="grp">غائب</div>'; if (i === 6) rows += '<div class="grp">حاضر</div>'; if (i === 12) rows += '<div class="grp">متکلم</div>'; }
      const lbl = isIsm ? ISM_LABELS[i][0] : SIGHA[i][0].replace(/ (غائب|حاضر)$/, '');
      rows += `<div class="r"><span class="fm">${f}</span><span class="lb">${lbl}${isIsm ? '' : `<span class="ar">${SIGHA[i][1]}</span>`}</span></div>`;
    });
    return `<div class="tbl"><h3><span>${g.ur}</span><button class="copy" data-copy="${esc(forms.join('، '))}">کاپی</button></h3>${rows}</div>`;
  }
  function draw() {
    const ok = st.root.length === 3 && st.root.every((x) => x && /[ء-ي]/.test(x));
    const S0 = ok ? sarfSagheer(st.bab, st.root) : null;
    const ownMasdar = opts.masdar && (!opts.bab || opts.bab === st.bab);
    const masdar = ownMasdar ? opts.masdar : (S0 && S0.masdar) || '';
    q('title').textContent = masdar || (S0 ? S0.madi : '');
    q('mean').textContent = ownMasdar ? (opts.meaning || '') : 'اسی مادہ سے ' + BABS[st.bab].ur;
    q('meta').innerHTML = `<span class="pill root">${st.root.join(' ')}</span>${ok ? `<span class="pill">${rootKind(st.root)}</span>` : ''}`;
    q('babinfo').innerHTML = babCard(st.bab, store.get('babOpen', false));
    if (!ok) { q('sagheer').hidden = true; q('tables').innerHTML = '<div class="warn">مادہ کے تینوں حروف درج کریں۔</div>'; q('note').textContent = ''; return; }
    q('sagheer').hidden = false;
    const ms = masdar ? accus(masdar) : '';
    const lz = BABS[st.bab].lazim || st.bab === 'k';
    q('sagheer').innerHTML = `<span class="k">صرفِ صغیر</span><b>${S0.madi}</b> ${S0.mudari}${ms ? ' ' + ms : ''} فَهُوَ ${S0.faail}${lz ? '' : `، وَ${S0.madiP} ${S0.mudariP} فَهُوَ ${S0.mafool}`}، الأَمْرُ مِنْهُ ${S0.amr} وَالنَّهْيُ عَنْهُ ${S0.nahi}`;
    if (st.type === 'all') { q('tables').className = 'tables multi'; q('tables').innerHTML = GARDAAN_TYPES.map((g) => table(g.k)).join(''); }
    else { q('tables').className = 'tables'; q('tables').innerHTML = table(st.type); }
    q('note').textContent = rootKind(st.root) !== 'صحیح' ? 'معتل، مضاعف اور مہموز مادوں کی گردان قواعدِ تعلیل سے بنتی ہے؛ نادر الفاظ لغت سے ملا لیں۔' : '';
  }
  draw();
}

// ---------- docked sheet ----------
let lastFocus = null;
function openSheet(d) {
  lastFocus = document.activeElement;
  gardaanPanel($('#sheetOut'), { id: 's', masdar: d.m, meaning: d.u, root: d.root, bab: d.b, onClose: closeSheet });
  $('#sheet').hidden = false; document.body.style.overflow = 'hidden';
  $('#sheet .body').scrollTop = 0; $('#sheetOut .close').focus();
}
function closeSheet() { $('#sheet').hidden = true; document.body.style.overflow = ''; lastFocus && lastFocus.focus(); }
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#sheet').hidden) return closeSheet();
  if (!$('#view-study').hidden && $('#sheet').hidden && !/INPUT|SELECT/.test(document.activeElement.tagName)) {
    if (e.key === 'ArrowLeft') step(1); else if (e.key === 'ArrowRight') step(-1); else if (e.key === ' ') { e.preventDefault(); flip(); }
  }
});

// ---------- study ----------
let deck = [], pos = 0, flipped = false, sBab = 'all';
$('#studyBab').innerHTML = babOptions(true);
function buildDeck() {
  const mode = $('#studyMode').value;
  deck = DATA.filter((d) => (sBab === 'all' || d.b === sBab) && (mode === 'all' || !known.has(d.id)));
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  pos = 0; flipped = false;
}
function renderStudy() {
  if (!renderStudy.init) { buildDeck(); renderStudy.init = 1; }
  $('#flip').classList.toggle('on', flipped);
  if (!deck.length) { $('#front').innerHTML = '<div class="um">اس انتخاب میں کوئی کارڈ نہیں</div>'; $('#back').innerHTML = ''; $('#studyCount').textContent = '0 / 0'; $('#prog').style.width = '0'; return; }
  const d = deck[pos], S0 = sarfSagheer(d.b, d.root);
  const tag = `<span class="tag"><span class="dot${isMz(d.b) ? ' mz' : ''}"></span>${BABS[d.b].ur}</span>`;
  const arSide = `<div class="big">${d.m}</div><div class="sub">${S0.madi} · ${S0.mudari}</div>${tag}`;
  const urSide = `<div class="um">${esc(d.u)}</div><div class="sub">${d.root.join(' ')}</div>`;
  const arFront = $('#studyFront').value === 'ar';
  $('#front').innerHTML = (arFront ? arSide : urSide) + '<span class="hint">پلٹنے کے لیے ٹیپ کریں</span>';
  $('#back').innerHTML = arFront ? urSide + tag : arSide;
  $('#studyCount').textContent = `${pos + 1} / ${deck.length}`;
  $('#prog').style.width = ((pos + 1) / deck.length * 100) + '%';
  $('#knownC').setAttribute('aria-pressed', known.has(d.id));
}
function flip() { flipped = !flipped; $('#flip').classList.toggle('on', flipped); }
function step(n) { if (!deck.length) return; pos = (pos + n + deck.length) % deck.length; flipped = false; renderStudy(); }
$('#flip').onclick = flip; $('#flipC').onclick = flip;
$('#nextC').onclick = () => step(1); $('#prevC').onclick = () => step(-1);
$('#shuffleC').onclick = () => { buildDeck(); renderStudy(); toast('ترتیب بدل دی گئی'); };
$('#studyBab').onchange = (e) => { sBab = e.target.value; buildDeck(); renderStudy(); };
$('#studyMode').onchange = () => { buildDeck(); renderStudy(); };
$('#studyFront').onchange = () => { flipped = false; renderStudy(); };
$('#knownC').onclick = () => { const d = deck[pos]; if (!d) return; known.has(d.id) ? known.delete(d.id) : known.add(d.id); saveKnown(); renderStudy(); };
$('#gardC').onclick = () => { if (deck[pos]) openSheet(deck[pos]); };
let tx = null; $('#flip').addEventListener('touchstart', (e) => tx = e.touches[0].clientX, { passive: true });
$('#flip').addEventListener('touchend', (e) => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) { e.preventDefault(); step(dx < 0 ? 1 : -1); } tx = null; });

// ---------- maker ----------
['اِسْتِغْفَار', 'تَعَلُّم', 'إِرْسَال', 'اِنْكِسَار', 'مُرَاسَلَة', 'نُصْرَة'].forEach((x) => $('.examples').insertAdjacentHTML('beforeend', `<button data-ex="${x}">${x}</button>`));
$('.examples').onclick = (e) => { const b = e.target.closest('[data-ex]'); if (!b) return; $('#mIn').value = b.dataset.ex; runMaker(); };
function runMaker() {
  const v = $('#mIn').value.trim();
  if (!v) { $('#makerOut').innerHTML = ''; return; }
  const hit = byNorm.get(normalize(v).replace(/[ٌٍ]/g, ''));
  if (hit) return gardaanPanel($('#makerOut'), { id: 'm', masdar: hit.m, meaning: hit.u, root: hit.root, bab: hit.b, editableRoot: true });
  const det = detectMasdar(v);
  let bab = det.bab, guessed = det.guessed, meaning = '';
  if (!bab) {
    const same = DATA.find((d) => d.nr === det.root.join('') && !isMz(d.b));
    if (same) { bab = same.b; meaning = `اسی مادہ سے: ${same.m} (${same.u})`; guessed = false; }
  }
  gardaanPanel($('#makerOut'), { id: 'm', masdar: v, meaning, root: det.root, bab: bab || 'n', guessed, editableRoot: true });
}
$('#mGo').onclick = runMaker;
$('#mIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') runMaker(); });

// ---------- PWA ----------
let deferred = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; $('#installBtn').hidden = false; });
$('#installBtn').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; $('#installBtn').hidden = true; };
if ('serviceWorker' in navigator && location.protocol !== 'file:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {} }

// ---------- init ----------
syncBabSel(); renderGrid(); show(location.hash.slice(1));
$('#mIn').value = 'اِسْتِغْفَار'; runMaker();
})();
</script>
